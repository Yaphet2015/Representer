name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Type check
        run: npm run compile

      - name: Test
        run: npm test

      - name: Build and zip
        env:
          # GA4 Measurement Protocol secret; unset → anonymous stats are compiled out to a no-op
          WXT_GA_API_SECRET: ${{ secrets.WXT_GA_API_SECRET }}
        run: npm run zip

      - name: Locate zip and verify manifest version
        id: zip
        run: |
          ZIP="$(ls .output/*-chrome.zip | head -n1)"
          test -f "$ZIP"
          MANIFEST_VERSION="$(node -p "require('./.output/chrome-mv3/manifest.json').version")"
          if [ "$MANIFEST_VERSION" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::manifest.json version $MANIFEST_VERSION does not match tag $GITHUB_REF_NAME"
            exit 1
          fi
          echo "path=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Upload and submit to Chrome Web Store
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          # Legacy fallback, used only when CWS_SERVICE_ACCOUNT_KEY is not set.
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          ZIP_PATH: ${{ steps.zip.outputs.path }}
        run: node scripts/cws-publish.mjs "$ZIP_PATH"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.zip.outputs.path }}" \
            --title "Representer $GITHUB_REF_NAME" --generate-notes
